<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mercari Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='recent_keywords.js') }}"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f5f3; color: #1a1714; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0ccc8; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #b0aca8; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
{% raw %}
<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;

// ── Tweakable defaults (originally a Claude Design tweaks panel) ───────────
const ACCENT  = "#e84040";
const LAYOUT  = "list";          // "list" | "grid"
const DENSITY = "comfortable";   // "comfortable" | "compact"
const SHOW_IMG = true;
const SPLIT_RATIO = 55;          // % width of results panel

// ── Color utilities ────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function accentAlpha(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

function formatPrice(value) {
  if (value === null || value === undefined || value === "" || value === 0 || value === "0") return "¥?";
  const n = typeof value === "number" ? value : parseInt(String(value).replace(/,/g, "").trim(), 10);
  if (Number.isNaN(n)) return `¥${value}`;
  return `¥${n.toLocaleString()}`;
}

// ── Thumbnail (Mercari image when available, fallback to icon) ─────────────
function PlaceholderImg({ size = 56, src }) {
  const [failed, setFailed] = useState(false);
  const base = {
    width:size, height:size, minWidth:size,
    background:"#ede9e5", borderRadius:8,
    display:"flex", alignItems:"center", justifyContent:"center",
    fontSize:size*0.45, userSelect:"none",
    overflow:"hidden",
  };
  if (src && !failed) {
    return (
      <div style={base}>
        <img
          src={src}
          alt=""
          loading="lazy"
          referrerPolicy="no-referrer"
          onError={() => setFailed(true)}
          style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}
        />
      </div>
    );
  }
  return <div style={base}>🛍</div>;
}

// ── Result Row (list layout) ───────────────────────────────────────────────
function ResultRow({ item, selected, focused, onSelect, onDoubleClick, density, accent, showImg }) {
  const pad = density === "compact" ? "8px 12px" : "12px 16px";
  const bg = focused ? accentAlpha(accent, 0.12) : selected ? accentAlpha(accent, 0.07) : "transparent";
  const border = focused ? `1.5px solid ${accentAlpha(accent, 0.5)}` : "1.5px solid transparent";
  return (
    <div
      onClick={onSelect}
      onDoubleClick={onDoubleClick}
      style={{ padding:pad, display:"flex", gap:12, alignItems:"center", background:bg, border, borderRadius:8, margin:"2px 4px", cursor:"pointer", transition:"background 0.12s" }}
    >
      {showImg && <PlaceholderImg size={density==="compact"?40:52} src={item.thumbnail} />}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:14, fontWeight:500, color:"#1a1714", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
          {item.title || "(no title)"}
        </div>
        <div style={{ fontSize:12, color:"#888", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
          ID {item.id}
        </div>
      </div>
      <div style={{ fontSize:16, fontWeight:600, color:accent, whiteSpace:"nowrap" }}>
        {formatPrice(item.price)}
      </div>
    </div>
  );
}

// ── Result Card (grid layout) ──────────────────────────────────────────────
function ResultCard({ item, selected, focused, onSelect, onDoubleClick, accent }) {
  const bg = focused ? accentAlpha(accent, 0.1) : selected ? accentAlpha(accent, 0.06) : "#fff";
  const shadow = focused ? `0 0 0 2px ${accentAlpha(accent,0.5)}` : selected ? `0 0 0 1.5px ${accentAlpha(accent,0.3)}` : "0 1px 4px rgba(0,0,0,0.08)";
  return (
    <div onClick={onSelect} onDoubleClick={onDoubleClick}
      style={{ background:bg, borderRadius:10, boxShadow:shadow, padding:"12px", cursor:"pointer", transition:"box-shadow 0.12s, background 0.12s", display:"flex", flexDirection:"column", gap:8 }}>
      <PlaceholderImg size={80} src={item.thumbnail} />
      <div style={{ fontSize:13, fontWeight:500, color:"#1a1714", lineHeight:1.35, WebkitLineClamp:2, overflow:"hidden", display:"-webkit-box", WebkitBoxOrient:"vertical" }}>{item.title}</div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span style={{ fontSize:15, fontWeight:600, color:accent }}>{formatPrice(item.price)}</span>
      </div>
    </div>
  );
}

// ── Details Panel ──────────────────────────────────────────────────────────
function DetailsPanel({ items, loading, accent, onCopy }) {
  if (loading) return (
    <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:10, color:accent }}>
      <div style={{ width:18, height:18, border:`2px solid ${accentAlpha(accent,0.2)}`, borderTopColor:accent, borderRadius:"50%", animation:"spin 0.7s linear infinite" }}></div>
      <span style={{ fontSize:13 }}>Loading details…</span>
    </div>
  );
  if (!items.length) return (
    <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:12, color:"#bbb" }}>
      <div style={{ fontSize:40 }}>🔍</div>
      <div style={{ fontSize:14, fontWeight:500 }}>Select an item to view details</div>
      <div style={{ fontSize:12 }}>Double-click for quick view · Ctrl/Shift-click to multi-select</div>
    </div>
  );
  if (items.length === 1) {
    const it = items[0];
    return (
      <div style={{ padding:"20px 24px", overflowY:"auto", height:"100%" }}>
        <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:20 }}>
          <PlaceholderImg size={120} src={it.thumbnail} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:18, fontWeight:600, lineHeight:1.3, marginBottom:6, wordBreak:"break-word" }}>{it.title || "(no title)"}</div>
            <div style={{ fontSize:24, fontWeight:700, color:accent }}>{formatPrice(it.price)}</div>
            <div style={{ marginTop:10 }}>
              <button
                onClick={() => onCopy(it)}
                style={{ height:32, padding:"0 12px", background:accent, color:"#fff", border:"none", borderRadius:8, fontSize:13, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}
              >
                Copy to Draft
              </button>
            </div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:"10px 20px", marginBottom:16 }}>
          <div>
            <div style={{ fontSize:11, color:"#999", marginBottom:2, textTransform:"uppercase", letterSpacing:"0.04em" }}>ID</div>
            <div style={{ fontSize:14, fontWeight:500, color:"#333", fontFamily:"ui-monospace, monospace" }}>{it.id}</div>
          </div>
          {it.url && (
            <div>
              <div style={{ fontSize:11, color:"#999", marginBottom:2, textTransform:"uppercase", letterSpacing:"0.04em" }}>Link</div>
              <a href={it.url} target="_blank" rel="noreferrer noopener" style={{ fontSize:14, fontWeight:500, color:accent, wordBreak:"break-all" }}>{it.url}</a>
            </div>
          )}
          {it.category && (
            <div>
              <div style={{ fontSize:11, color:"#999", marginBottom:2, textTransform:"uppercase", letterSpacing:"0.04em" }}>Category</div>
              <div style={{ fontSize:14, fontWeight:500, color:"#333" }}>{it.category}</div>
            </div>
          )}
        </div>
        <div style={{ borderTop:"1px solid #eee", paddingTop:14 }}>
          <div style={{ fontSize:11, color:"#999", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.04em" }}>Description</div>
          <div style={{ fontSize:14, color:"#444", lineHeight:1.6, whiteSpace:"pre-wrap" }}>
            {(it.description && it.description.trim()) || "(empty description)"}
          </div>
        </div>
      </div>
    );
  }
  // multi-select summary
  const total = items.reduce((s,i)=>s + (parseInt(String(i.price ?? 0).replace(/,/g,""),10) || 0), 0);
  const avg = Math.round(total / items.length);
  return (
    <div style={{ padding:"20px 24px", overflowY:"auto", height:"100%" }}>
      <div style={{ fontSize:15, fontWeight:600, marginBottom:16 }}>{items.length} items selected</div>
      <div style={{ marginBottom:16, padding:"12px 14px", background:accentAlpha(accent,0.06), borderRadius:10 }}>
        <div style={{ fontSize:12, color:"#999", marginBottom:4 }}>Total value</div>
        <div style={{ fontSize:26, fontWeight:700, color:accent }}>¥{total.toLocaleString()}</div>
        <div style={{ fontSize:12, color:"#999", marginTop:2 }}>avg ¥{avg.toLocaleString()}</div>
      </div>
      {items.map(it=>(
        <div key={it.id} style={{ display:"flex", gap:10, padding:"10px 0", borderBottom:"1px solid #f0ece8", alignItems:"center" }}>
          <PlaceholderImg size={36} src={it.thumbnail} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:500, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{it.title || "(no title)"}</div>
            {it.url && <a href={it.url} target="_blank" rel="noreferrer noopener" style={{ fontSize:11, color:"#888" }}>Open ↗</a>}
          </div>
          <div style={{ fontSize:14, fontWeight:600, color:accent }}>{formatPrice(it.price)}</div>
        </div>
      ))}
    </div>
  );
}

function DraftPanel({ draft, setDraft, accent }) {
  const update = (key, value) => setDraft(prev => ({ ...(prev || {}), [key]: value }));
  const [saveHint, setSaveHint] = useState("");
  const [autoFillHint, setAutoFillHint] = useState("");
  const [cdpUrl, setCdpUrl] = useState("http://127.0.0.1:9222");

  const saveDraftForAutomation = async () => {
    if (!draft) return;
    try {
      const resp = await fetch("/api/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(draft),
      });
      const body = await resp.json();
      if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
      setSaveHint("草稿已保存，可运行 Playwright 自动填表脚本。");
    } catch (err) {
      setSaveHint(`保存失败: ${err.message}`);
    }
  };

  const runAutoFill = async () => {
    try {
      const resp = await fetch("/api/auto-fill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cdpUrl: cdpUrl.trim() }),
      });
      const body = await resp.json();
      if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
      setAutoFillHint(`已启动自动填表。日志文件: ${body.logFile || "logs/autofill.log"}`);
    } catch (err) {
      setAutoFillHint(`启动失败: ${err.message}`);
    }
  };

  if (!draft) {
    return (
      <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:10, color:"#bbb", padding:"20px" }}>
        <div style={{ fontSize:30 }}>📝</div>
        <div style={{ fontSize:14, fontWeight:500 }}>No draft yet</div>
        <div style={{ fontSize:12 }}>Open one item detail and click "Copy to Draft".</div>
      </div>
    );
  }

  return (
    <div style={{ padding:"16px", overflowY:"auto", height:"100%" }}>
      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>商品名</div>
      <input
        value={draft.title || ""}
        maxLength={40}
        onChange={e => update("title", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:14, fontFamily:"inherit" }}
      />
      <div style={{ fontSize:11, color:"#aaa", textAlign:"right", marginTop:"-8px", marginBottom:"10px" }}>{(draft.title || "").length}/40</div>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>カテゴリー</div>
      <input
        data-testid="draft-category"
        value={draft.category || ""}
        onChange={e => update("category", e.target.value)}
        placeholder="例: おもちゃ・ホビー・グッズ > キャラクターグッズ"
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit" }}
      />

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>商品の状態</div>
      <select
        value={draft.condition || "未設定"}
        onChange={e => update("condition", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit", background:"#fff" }}
      >
        <option>未設定</option>
        <option>新品、未使用</option>
        <option>未使用に近い</option>
        <option>目立った傷や汚れなし</option>
        <option>やや傷や汚れあり</option>
        <option>傷や汚れあり</option>
        <option>全体的に状態が悪い</option>
      </select>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>商品の説明</div>
      <textarea
        value={draft.description || ""}
        maxLength={1000}
        onChange={e => update("description", e.target.value)}
        style={{ width:"100%", minHeight:180, marginBottom:12, padding:"10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:14, lineHeight:1.5, fontFamily:"inherit", resize:"vertical" }}
      />
      <div style={{ fontSize:11, color:"#aaa", textAlign:"right", marginTop:"-8px", marginBottom:"10px" }}>{(draft.description || "").length}/1000</div>

      <div style={{ fontSize:14, fontWeight:600, color:"#666", margin:"8px 0 10px" }}>配送について</div>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>配送料の負担</div>
      <select
        value={draft.shippingPayer || "送料込み(出品者負担)"}
        onChange={e => update("shippingPayer", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit", background:"#fff" }}
      >
        <option>送料込み(出品者負担)</option>
        <option>着払い(購入者負担)</option>
      </select>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>配送の方法</div>
      <select
        value={draft.shippingMethod || ""}
        onChange={e => update("shippingMethod", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit", background:"#fff" }}
      >
        <option value="">未設定</option>
        <option>らくらくメルカリ便</option>
        <option>ゆうゆうメルカリ便</option>
      </select>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>発送元の地域</div>
      <input
        value={draft.shippingFrom || ""}
        onChange={e => update("shippingFrom", e.target.value)}
        placeholder="例: 東京都"
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit" }}
      />

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>発送までの日数</div>
      <select
        value={draft.shippingDays || "2~3日で発送"}
        onChange={e => update("shippingDays", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit", background:"#fff" }}
      >
        <option>1~2日で発送</option>
        <option>2~3日で発送</option>
        <option>4~7日で発送</option>
      </select>

      <div style={{ fontSize:14, fontWeight:600, color:"#666", margin:"8px 0 10px" }}>販売タイプ</div>
      <select
        value={draft.saleType || "価格を設定する"}
        onChange={e => update("saleType", e.target.value)}
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit", background:"#fff" }}
      >
        <option>価格を設定する</option>
        <option>オークション形式</option>
      </select>

      <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>販売価格</div>
      <input
        value={draft.price ?? ""}
        onChange={e => update("price", e.target.value)}
        placeholder="例: 300"
        style={{ width:"100%", height:34, marginBottom:12, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:14, fontFamily:"inherit" }}
      />
      <button
        data-testid="save-draft"
        onClick={saveDraftForAutomation}
        style={{ width:"100%", height:36, background:"#fff", color:accent, border:`1px solid ${accent}`, borderRadius:8, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit", marginTop:4 }}
      >
        保存草稿（自动出品用）
      </button>
      {saveHint && <div style={{ marginTop:8, fontSize:12, color:"#666" }}>{saveHint}</div>}
      <div style={{ fontSize:12, color:"#999", marginTop:10, marginBottom:6 }}>现有浏览器 CDP 地址</div>
      <input
        value={cdpUrl}
        onChange={e => setCdpUrl(e.target.value)}
        placeholder="http://127.0.0.1:9222"
        style={{ width:"100%", height:34, marginBottom:8, padding:"0 10px", border:"1px solid #e0dbd6", borderRadius:8, fontSize:13, fontFamily:"inherit" }}
      />
      <button
        onClick={runAutoFill}
        style={{ width:"100%", height:36, background:"#fff", color:"#333", border:"1px solid #d0ccc8", borderRadius:8, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit", marginTop:8 }}
      >
        运行自动填表（连接现有浏览器）
      </button>
      {autoFillHint && <div style={{ marginTop:8, fontSize:12, color:"#666" }}>{autoFillHint}</div>}
      <div style={{ marginTop:10, fontSize:12, color:"#888" }}>
        注意: 浏览器安全限制下，无法从本页面直接跨站自动填写 Mercari 表单。
      </div>
      <div style={{ marginTop:6, fontSize:12, color:"#888" }}>
        草稿保存在当前 webapp 进程内存中，重启 `python webapp.py` 后会清空。
      </div>
      <div style={{ marginTop:6, fontSize:12, color:accent }}>Draft is kept while you browse other items.</div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App() {
  const accent  = ACCENT;
  const layout  = LAYOUT;
  const density = DENSITY;
  const showImg = SHOW_IMG;
  const splitRatio = SPLIT_RATIO;

  const [keyword, setKeyword] = useState("");
  const [topN, setTopN] = useState(10);
  const RECENT_KEY = "mercari-agent.recent-keywords";
  const RECENT_MAX = 10;
  const [recent, setRecent] = useState(() => {
    try {
      const raw = localStorage.getItem(RECENT_KEY);
      return RecentKeywords.sanitize(raw ? JSON.parse(raw) : [], RECENT_MAX);
    } catch { return []; }
  });
  const [historyOpen, setHistoryOpen] = useState(false);
  const persistRecent = useCallback((next) => {
    setRecent(next);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(next)); } catch {}
  }, []);
  const pushRecent = useCallback((kw) => {
    persistRecent(RecentKeywords.add(recent, kw, RECENT_MAX));
  }, [recent, persistRecent]);
  const removeRecent = useCallback((kw) => {
    persistRecent(RecentKeywords.remove(recent, kw));
  }, [recent, persistRecent]);
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(new Set());
  const [focused, setFocused] = useState(null);
  const [status, setStatus] = useState("Ready");
  const [searching, setSearching] = useState(false);
  const [detailsVisible, setDetailsVisible] = useState(false);
  const [draftVisible, setDraftVisible] = useState(false);
  const [mainSplitRatio, setMainSplitRatio] = useState(splitRatio);
  const [sideSplitRatio, setSideSplitRatio] = useState(50); // details width % when both visible
  const [detailItems, setDetailItems] = useState([]);
  const [detailsLoading, setDetailsLoading] = useState(false);
  const [draftItem, setDraftItem] = useState(null);
  const detailReqRef = useRef(0);
  const dragRef = useRef(null);

  const runSearch = useCallback(async (kwArg) => {
    const kw = (kwArg ?? keyword).trim();
    if (!kw) { setStatus("Enter a keyword to search"); return; }
    setHistoryOpen(false);
    pushRecent(kw);
    setSearching(true);
    setSelected(new Set());
    setFocused(null);
    setDetailItems([]);
    setStatus(`Searching for "${kw}"…`);
    try {
      const resp = await fetch(`/api/search?keyword=${encodeURIComponent(kw)}&top_n=${topN}`);
      const body = await resp.json();
      if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
      const items = body.items || [];
      setResults(items);
      setStatus(items.length ? `${items.length} results found for "${kw}"` : `No results for "${kw}"`);
    } catch (err) {
      setResults([]);
      setStatus(`✖ Search failed: ${err.message}`);
    } finally {
      setSearching(false);
    }
  }, [keyword, topN, pushRecent]);
  const search = useCallback(() => runSearch(), [runSearch]);

  const handleKeyDown = (e) => { if (e.key === "Enter") search(); };

  const handleSelect = (e, id) => {
    setFocused(id);
    if (e.ctrlKey || e.metaKey) {
      setSelected(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });
    } else if (e.shiftKey && results.length) {
      const ids = results.map(r=>r.id);
      const last = focused != null ? ids.indexOf(focused) : 0;
      const cur = ids.indexOf(id);
      const [a,b] = [Math.min(last,cur), Math.max(last,cur)];
      setSelected(new Set(ids.slice(a,b+1)));
    } else {
      setSelected(new Set([id]));
    }
  };

  // Fetch details whenever selection changes.
  useEffect(() => {
    if (selected.size === 0) { setDetailItems([]); setDetailsLoading(false); return; }
    const ids = results.filter(r => selected.has(r.id)).map(r => r.id);
    if (ids.length === 0) { setDetailItems([]); return; }
    const reqId = ++detailReqRef.current;
    setDetailsLoading(true);
    fetch(`/api/details?ids=${encodeURIComponent(ids.join(","))}`)
      .then(async r => {
        const body = await r.json();
        if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
        return body.items || [];
      })
      .then(items => {
        if (detailReqRef.current !== reqId) return; // stale
        // backfill thumbnails from the search results when missing
        const byId = new Map(results.map(r => [r.id, r]));
        const merged = items.map(it => ({
          ...it,
          thumbnail: it.thumbnail || (byId.get(it.id) && byId.get(it.id).thumbnail) || "",
        }));
        setDetailItems(merged);
        setStatus(`✓ Loaded details for ${merged.length} item(s)`);
      })
      .catch(err => {
        if (detailReqRef.current !== reqId) return;
        setDetailItems([]);
        setStatus(`✖ Fetch failed: ${err.message}`);
      })
      .finally(() => {
        if (detailReqRef.current === reqId) setDetailsLoading(false);
      });
  }, [selected, results]);

  const copyToDraft = useCallback((item) => {
    setDraftItem({
      id: item.id || "",
      title: item.title || "",
      category: item.category || "",
      condition: "未設定",
      description: item.description || "",
      url: item.url || "",
      price: item.price ?? "",
      thumbnail: item.thumbnail || "",
      shippingPayer: "送料込み(出品者負担)",
      shippingMethod: "らくらくメルカリ便",
      shippingFrom: "東京都",
      shippingDays: "2~3日で発送",
      saleType: "価格を設定する",
    });
    setDraftVisible(true);
    setStatus(`Copied ${item.id || "item"} to draft`);
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragRef.current) return;
      const mode = dragRef.current.mode;
      if (mode === "main") {
        const ratio = (e.clientX / window.innerWidth) * 100;
        setMainSplitRatio(Math.max(25, Math.min(75, ratio)));
      } else if (mode === "side") {
        const { left, width } = dragRef.current.rect;
        if (!width) return;
        const ratio = ((e.clientX - left) / width) * 100;
        setSideSplitRatio(Math.max(20, Math.min(80, ratio)));
      }
    };
    const onUp = () => {
      dragRef.current = null;
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", background:"#f7f5f3" }}>
      {/* Header */}
      <div style={{ background:"#fff", borderBottom:"1px solid #e8e4e0", padding:"0 20px", display:"flex", alignItems:"center", gap:14, height:56, flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginRight:8 }}>
          <div style={{ width:28, height:28, background:accent, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", fontSize:15 }}>🛍</div>
          <span style={{ fontWeight:600, fontSize:15, color:"#1a1714" }}>Mercari Agent</span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, flex:1 }}>
          <label style={{ fontSize:13, color:"#888", fontWeight:500, whiteSpace:"nowrap" }}>Keyword</label>
          <div style={{ position:"relative", flex:1 }}>
            <input
              value={keyword}
              onChange={e=>setKeyword(e.target.value)}
              onKeyDown={(e)=>{
                if (e.key === "Enter") { runSearch(); }
                else if (e.key === "Escape") { setHistoryOpen(false); }
              }}
              onFocus={(e)=>{ e.target.style.borderColor=accent; setHistoryOpen(true); }}
              onBlur={(e)=>{ e.target.style.borderColor="#e0dbd6"; setTimeout(()=>setHistoryOpen(false), 150); }}
              placeholder="e.g. Nintendo Switch, Sony WH-1000XM5…"
              style={{ width:"100%", height:34, padding:"0 12px", border:"1.5px solid #e0dbd6", borderRadius:8, fontSize:14, outline:"none", fontFamily:"inherit", background:"#faf9f7", transition:"border-color 0.15s" }}
            />
            {historyOpen && recent.length > 0 && (
              <div
                onMouseDown={(e)=>e.preventDefault()} /* keep focus on input so onBlur of input doesn't fire before click */
                style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:"#fff", border:"1px solid #e0dbd6", borderRadius:8, boxShadow:"0 4px 16px rgba(0,0,0,0.08)", zIndex:50, maxHeight:320, overflowY:"auto" }}
              >
                <div style={{ padding:"8px 12px 4px", fontSize:11, color:"#aaa", textTransform:"uppercase", letterSpacing:"0.04em", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span>Recent searches</span>
                  <button
                    onClick={()=>{ persistRecent([]); setHistoryOpen(false); }}
                    style={{ background:"transparent", border:"none", color:"#aaa", fontSize:11, cursor:"pointer", padding:0, fontFamily:"inherit" }}
                  >Clear all</button>
                </div>
                {recent.map((kw)=>(
                  <div
                    key={kw}
                    onClick={()=>{ setKeyword(kw); runSearch(kw); }}
                    style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px", cursor:"pointer", fontSize:13, color:"#333" }}
                    onMouseEnter={(e)=>e.currentTarget.style.background=accentAlpha(accent,0.08)}
                    onMouseLeave={(e)=>e.currentTarget.style.background="transparent"}
                  >
                    <span style={{ color:"#bbb", fontSize:12 }}>🕘</span>
                    <span style={{ flex:1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{kw}</span>
                    <button
                      onClick={(e)=>{ e.stopPropagation(); removeRecent(kw); }}
                      title="Remove"
                      style={{ background:"transparent", border:"none", color:"#bbb", fontSize:14, lineHeight:1, cursor:"pointer", padding:"2px 4px", borderRadius:4, fontFamily:"inherit" }}
                      onMouseEnter={(e)=>{ e.currentTarget.style.color="#666"; }}
                      onMouseLeave={(e)=>{ e.currentTarget.style.color="#bbb"; }}
                    >✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
          <label style={{ fontSize:13, color:"#888", fontWeight:500 }}>Top-N</label>
          <input
            type="number" min={1} max={50} value={topN}
            onChange={e=>setTopN(Math.max(1,Math.min(50,parseInt(e.target.value)||10)))}
            style={{ width:56, height:34, padding:"0 8px", border:"1.5px solid #e0dbd6", borderRadius:8, fontSize:14, outline:"none", fontFamily:"inherit", background:"#faf9f7", textAlign:"center" }}
          />
        </div>
        <button
          onClick={search}
          disabled={searching}
          style={{ height:34, padding:"0 20px", background:searching?"#ccc":accent, color:"#fff", border:"none", borderRadius:8, fontSize:14, fontWeight:600, cursor:searching?"default":"pointer", transition:"background 0.15s", flexShrink:0, fontFamily:"inherit" }}
        >
          {searching ? "Searching…" : "Search"}
        </button>
        <button
          onClick={()=>setDetailsVisible(v=>!v)}
          style={{ height:34, padding:"0 14px", background:detailsVisible?accentAlpha(accent,0.1):"transparent", color:detailsVisible?accent:"#888", border:`1.5px solid ${detailsVisible?accentAlpha(accent,0.3):"#e0dbd6"}`, borderRadius:8, fontSize:13, fontWeight:500, cursor:"pointer", flexShrink:0, fontFamily:"inherit", transition:"all 0.15s" }}
        >
          {detailsVisible ? "Hide Details" : "Show Details"}
        </button>
        <button
          onClick={()=>setDraftVisible(v=>!v)}
          style={{ height:34, padding:"0 14px", background:draftVisible?accentAlpha(accent,0.1):"transparent", color:draftVisible?accent:"#888", border:`1.5px solid ${draftVisible?accentAlpha(accent,0.3):"#e0dbd6"}`, borderRadius:8, fontSize:13, fontWeight:500, cursor:"pointer", flexShrink:0, fontFamily:"inherit", transition:"all 0.15s" }}
        >
          {draftVisible ? "Hide Draft" : "Show Draft"}
        </button>
      </div>

      {/* Main content */}
      <div style={{ flex:1, display:"flex", minHeight:0 }}>
        {/* Results panel */}
        <div style={{ width: (detailsVisible || draftVisible) ? `${mainSplitRatio}%` : "100%", display:"flex", flexDirection:"column", minHeight:0 }}>
          <div style={{ padding:"8px 16px 6px", fontSize:12, color:"#aaa", borderBottom:"1px solid #f0ece8", background:"#faf9f7", flexShrink:0 }}>
            Results — <strong>double-click</strong> = quick details · <strong>Ctrl/Shift+click</strong> = multi-select
            {results.length > 0 && <span style={{ float:"right", color:accent, fontWeight:600 }}>{results.length} items</span>}
          </div>
          <div style={{ flex:1, overflowY:"auto", padding: layout==="grid" ? "12px" : "8px 0" }}>
            {results.length === 0 && !searching && (
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100%", gap:12, color:"#ccc", paddingBottom:40 }}>
                <div style={{ fontSize:48 }}>🛍️</div>
                <div style={{ fontSize:15, fontWeight:500, color:"#bbb" }}>Search for items on Mercari</div>
                <div style={{ fontSize:13, color:"#ccc" }}>Try: Nintendo Switch, Sony, Supreme, Canon…</div>
              </div>
            )}
            {searching && (
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100%", gap:10, color:accent }}>
                <div style={{ width:20, height:20, border:`2px solid ${accentAlpha(accent,0.2)}`, borderTopColor:accent, borderRadius:"50%", animation:"spin 0.7s linear infinite" }}></div>
                <span style={{ fontSize:14 }}>Searching Mercari…</span>
              </div>
            )}
            {!searching && layout === "list" && results.map(item=>(
              <ResultRow key={item.id} item={item}
                selected={selected.has(item.id)} focused={focused===item.id}
                onSelect={e=>handleSelect(e,item.id)}
                onDoubleClick={()=>{ setFocused(item.id); setSelected(new Set([item.id])); setDetailsVisible(true); }}
                density={density} accent={accent} showImg={showImg} />
            ))}
            {!searching && layout === "grid" && (
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(140px, 1fr))", gap:10 }}>
                {results.map(item=>(
                  <ResultCard key={item.id} item={item}
                    selected={selected.has(item.id)} focused={focused===item.id}
                    onSelect={e=>handleSelect(e,item.id)}
                    onDoubleClick={()=>{ setFocused(item.id); setSelected(new Set([item.id])); setDetailsVisible(true); }}
                    accent={accent} />
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Divider */}
        {(detailsVisible || draftVisible) && (
          <div
            onMouseDown={() => {
              dragRef.current = { mode: "main" };
              document.body.style.cursor = "col-resize";
              document.body.style.userSelect = "none";
            }}
            style={{ width:6, background:"#e8e4e0", flexShrink:0, cursor:"col-resize" }}
          />
        )}

        {/* Details / Draft panels */}
        {(detailsVisible || draftVisible) && (
          <div style={{ flex:1, display:"flex", minHeight:0, background:"#fff" }}>
            {detailsVisible && (
            <div style={{ width:(detailsVisible && draftVisible) ? `${sideSplitRatio}%` : "100%", display:"flex", flexDirection:"column", minHeight:0 }}>
              <div style={{ padding:"8px 16px 6px", fontSize:12, color:"#aaa", borderBottom:"1px solid #f0ece8", background:"#faf9f7", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div>
                  Details
                  {detailItems.length > 1 && <span style={{ marginLeft:8, color:accent, fontWeight:600 }}>{detailItems.length} selected</span>}
                </div>
                <button
                  onClick={() => setDetailsVisible(false)}
                  style={{ border:"none", background:"transparent", color:"#888", cursor:"pointer", fontSize:12 }}
                >
                  Collapse
                </button>
              </div>
              <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column" }}>
                <DetailsPanel items={detailItems} loading={detailsLoading} accent={accent} onCopy={copyToDraft} />
              </div>
            </div>
            )}
            {(detailsVisible && draftVisible) && (
              <div
                onMouseDown={(e) => {
                  const parentRect = e.currentTarget.parentElement.getBoundingClientRect();
                  dragRef.current = { mode: "side", rect: parentRect };
                  document.body.style.cursor = "col-resize";
                  document.body.style.userSelect = "none";
                }}
                style={{ width:6, background:"#f0ece8", flexShrink:0, cursor:"col-resize" }}
              />
            )}
            {draftVisible && (
            <div style={{ width:(detailsVisible && draftVisible) ? `${100 - sideSplitRatio}%` : "100%", display:"flex", flexDirection:"column", minHeight:0 }}>
              <div style={{ padding:"8px 16px 6px", fontSize:12, color:"#aaa", borderBottom:"1px solid #f0ece8", background:"#faf9f7", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                Draft Listing
                <button
                  onClick={() => setDraftVisible(false)}
                  style={{ border:"none", background:"transparent", color:"#888", cursor:"pointer", fontSize:12 }}
                >
                  Collapse
                </button>
              </div>
              <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column" }}>
                <DraftPanel draft={draftItem} setDraft={setDraftItem} accent={accent} />
              </div>
            </div>
            )}
          </div>
        )}
      </div>

      {/* Status bar */}
      <div style={{ height:32, background:"#fff", borderTop:"1px solid #e8e4e0", display:"flex", alignItems:"center", padding:"0 16px", gap:16, flexShrink:0 }}>
        <div style={{ width:7, height:7, borderRadius:"50%", background:searching?"#f59e0b":results.length?"#22c55e":"#d0ccc8", transition:"background 0.3s" }}></div>
        <span style={{ fontSize:12, color:"#888" }}>{status}</span>
        {selected.size > 0 && <span style={{ fontSize:12, color:accent, fontWeight:500 }}>{selected.size} selected</span>}
        <div style={{ flex:1 }} />
        <span style={{ fontSize:11, color:"#ccc" }}>Mercari Agent · Web</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
{% endraw %}
</body>
</html>
